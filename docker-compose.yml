services:
  app:
    build: .
    container_name: recruto-fastapi
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: recruto-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
